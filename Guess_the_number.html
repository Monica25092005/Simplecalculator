<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the random number</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing: border-box;
        }
       .col{
        background-image: url("Bluefire1.avif");
         min-height: 100vh;
         display: flex;
         justify-content: center;
         align-items: center; 
        
       }
       .innerdiv{
        height:300px;
        width:550px;
        background-image:url("number.jpg");
        background-size: cover;
       background-position: center;
       /* background-repeat: no-repeat; */
       padding:20px;
       text-align: center;
       }
    .h1{
        margin-top:40px;
        color:rgb(244, 247, 248);
    }
    #btn{

        border:rgb(244, 247, 248)solid;
        color:rgb(2, 2, 2);
        border-radius: 5px;
        padding:4px;
        margin-top: 20px;
    }
    #guessnum{
    margin-top:20px;
    }
    #btn:hover{
        background-color: rgb(77, 138, 188);
        color:black;
       
    }
    #score{
        color:rgb(231, 235, 235);
        margin-top: 10px;
    }
    #result{
        color:rgb(231, 235, 235);
        margin-top: 10px;
    }
    
    </style>
</head>
<body>
    <div class="col">
    <div class="innerdiv">
   <h1 class="h1">Guess any number between 1 to 10</h1>
   <input type="text" id="guessnum"><br>
   <button onclick="check()" id="btn">Check</button>
   <p id="result">you are wrong/Right</p>
   <p id="score">score:10</p>
   </div>
   </div>
</body>

<script>
//selecting input box
var guessnum=document.getElementById("guessnum")
var result=document.getElementById("result")
var score=document.getElementById("score")
var randomnumber= Math.floor(Math.random()*10)+1

var totalscore=10
function check()
{
    var enterednumber=guessnum.value
if(randomnumber==enterednumber){
    console.log("Right")
    result.textContent="Right"
    alert("you won..")
    resetGame();
}
else{ 
    if(totalscore<1){
     result.textContent="play again";
    resetGame();
    }
    else{
    totalscore=totalscore-1
    score.textContent="score:"+totalscore
    result.textContent="Wrong"
}
}
}
function resetGame(){
    totalscore=10;
    score.textContent="Score: "+totalscore;
    randomnumber=Math.floor(Math.random()*10)+1;
    guessnum.value="";
}

</script>
</html>
